# Add this configuration to your main nginx (the one running on ports 80/443)
# Location: /etc/nginx/sites-available/nweber.me
# Then create symlink: sudo ln -s /etc/nginx/sites-available/nweber.me /etc/nginx/sites-enabled/
# Test config: sudo nginx -t
# Reload: sudo systemctl reload nginx

# HTTP - Redirect to HTTPS and handle Let's Encrypt challenges
server {
    listen 80;
    listen [::]:80;
    server_name nweber.me www.nweber.me;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS - Redirect www to non-www
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.nweber.me;

    # SSL certificates (obtain with: sudo certbot --nginx -d nweber.me -d www.nweber.me)
    ssl_certificate /etc/letsencrypt/live/nweber.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nweber.me/privkey.pem;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';

    # Redirect to non-www
    return 301 https://nweber.me$request_uri;
}

# HTTPS - Main site (proxies to portfolio on port 8081)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nweber.me;

    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/nweber.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nweber.me/privkey.pem;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logging
    access_log /var/log/nginx/nweber.me-access.log;
    error_log /var/log/nginx/nweber.me-error.log;

    # Redirect /index.html to /
    location = /index.html {
        return 301 /;
    }

    # Proxy to portfolio container on port 8081
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;

        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }
}
